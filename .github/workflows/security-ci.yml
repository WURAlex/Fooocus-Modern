name: Security CI

on:
  pull_request:
  push:
    branches:
      - main
      - modern-platform
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-tests:
    name: Downloader security tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned test dependency
        run: python -m pip install --disable-pip-version-check packaging==24.1

      - name: Run security test suite
        run: python -m unittest tests.test_model_loader tests.test_model_integrity tests.test_p1_legacy_migration tests.test_extra_utils tests.test_p1b_blip_rembg -v
